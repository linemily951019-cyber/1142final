<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- 替換為 p5.js 1.10.0 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <!-- 引入 ml5.js (HandPose 等影像辨識功能) -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>

  <body>
    <!-- 首頁 (Landing Page) 覆蓋層 -->
    <div id="landing-page">
      <div class="landing-content">
        <h1 id="typewriter-text" class="typewriter"></h1>
        
        <div id="landing-details" class="fade-hidden">
          <p class="desc">這是一個結合 AI 影像辨識的互動式急救教學平台。<br>透過鏡頭，我們將帶領你學習遇到常見意外時的正確處理步驟！</p>
          
          <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 800px; margin: 20px auto 30px;">
            <button onclick="openGuidePopup('WEB')" style="padding: 12px 20px; font-size: 18px; cursor: pointer; border-radius: 10px; background: #e0f7fa; border: 2px solid #00acc1; font-weight: bold; color: #006064; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;">🌐 網頁說明</button>
            <button onclick="openGuidePopup('PRACTICE')" style="padding: 12px 20px; font-size: 18px; cursor: pointer; border-radius: 10px; background: #ffe0b2; border: 2px solid #fb8c00; font-weight: bold; color: #e65100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;">🚑 實戰測驗說明</button>
            <button onclick="openGuidePopup('RUNNER')" style="padding: 12px 20px; font-size: 18px; cursor: pointer; border-radius: 10px; background: #e8f5e9; border: 2px solid #43a047; font-weight: bold; color: #1b5e20; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;">🏃 奔跑小人說明</button>
            <button onclick="openGuidePopup('GESTURE')" style="padding: 12px 20px; font-size: 18px; cursor: pointer; border-radius: 10px; background: #f3e5f5; border: 2px solid #8e24aa; font-weight: bold; color: #4a148c; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;">🖐️ 全網站手勢說明</button>
          </div>
          
          <button id="start-btn" onclick="startApp()" style="padding: 15px 40px; font-size: 24px; cursor: pointer; border-radius: 50px; background: #ff5252; color: white; border: 3px solid #ff1744; font-weight: bold; box-shadow: 0 6px 20px rgba(255, 82, 82, 0.6); transition: 0.2s;">🚀 開始探索</button>
        </div>
      </div>
    </div>

    <!-- 左上角稱號區 (預設隱藏，達成條件後由 JS 顯示) -->
    <div id="top-left-badge" class="badge-sparkle" style="display: none; position: absolute; top: 15px; left: 20px; z-index: 1000; color: #d84315; border: 3px solid #ffb300; padding: 10px 20px; font-size: 18px; font-weight: bold; border-radius: 8px;">
      🎖️ 稱號：基礎醫療處置專家
    </div>

    <!-- 右上角按鈕區 -->
    <div id="top-right-buttons">
      <button id="btn-home" class="top-btn" onclick="returnToHome()">🏠 回首頁</button>
      <button id="btn-practice" class="top-btn" onclick="togglePracticeMode()">實戰演練</button>
      <button id="btn-jumper" class="top-btn" onclick="toggleJumper()">跳躍小人</button>
    </div>

    <!-- 頂部醫療插圖與標題 -->
    <header id="main-header">
      <h1>🏥 醫療小天才養成記 🚑</h1>
      <p>學習基礎急救知識，跟著鏡頭一起動動手！👨‍⚕️👩‍⚕️</p>
    </header>

    <div id="app-container">
      <!-- 左側選單欄 -->
      <aside id="sidebar">
        <button class="level-btn" onclick="openPopup(0)">一般擦傷</button>
        <button class="level-btn" onclick="openPopup(1)">輕度燙傷</button>
        <button class="level-btn" onclick="openPopup(2)">急性扭傷</button>
        <button class="level-btn" onclick="openPopup(3)">異物刺傷</button>
        <button class="level-btn" onclick="openPopup(4)">猛烈流鼻血</button>
        <button class="level-btn" onclick="openPopup(5)">昆蟲螫傷</button>
        
        <!-- 手勢提示區 -->
        <div id="sidebar-instructions">
          <p>✋ <strong>手勢操作提示</strong></p>
          <ul>
            <li><strong>左邊手 OK</strong>：上一步</li>
            <li><strong>右邊手 OK</strong>：下一步</li>
            <li><strong>雙　手 OK</strong>：關閉視窗</li>
          </ul>
        </div>
      </aside>

      <!-- 攝影機畫面容器 -->
      <main id="canvas-container"></main>

      <!-- 右側滑入白底黑字說明框 -->
      <div id="instruction-popup" class="hidden">
        <button id="close-btn" onclick="closePopup()">✖</button>
        <div id="popup-content"></div>
        <div id="popup-controls">
          <button id="prev-btn" onclick="prevPage()">⬅ 上一步</button>
          <span id="page-indicator">1 / 1</span>
          <button id="next-btn" onclick="nextPage()">下一步 ➡</button>
        </div>
      </div>
    </div>

    <script src="sketch.js"></script>
    
    <!-- 首頁打字機與過渡動畫腳本 -->
    <script>
      const titleText = "🏥 歡迎來到 醫療小天才養成記 🚑";
      let charIndex = 0;
      
      function typeWriter() {
        if (charIndex < titleText.length) {
          document.getElementById("typewriter-text").innerHTML += titleText.charAt(charIndex);
          charIndex++;
          setTimeout(typeWriter, 120); // 打字速度，數字越小越快
        } else {
          // 打字完成後，淡入顯示下方說明與按鈕
          document.getElementById("landing-details").classList.add("fade-visible");
        }
      }
      
      function startApp() {
        const landing = document.getElementById("landing-page");
        landing.style.opacity = '0'; // 觸發 CSS 消失動畫
        setTimeout(() => { landing.style.display = 'none'; }, 800); // 動畫結束後隱藏 DOM
      }
      
      // 網頁載入後延遲半秒開始打字機效果
      setTimeout(typeWriter, 500);
    </script>
  </body>
</html>
